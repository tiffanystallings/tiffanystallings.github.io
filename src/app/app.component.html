<div id="layout-parent">
  <nav>
    @if (windowSize > 1000) {
      <app-header [windowSize]="windowSize"/>
    }
    <app-navbar [windowSize]="windowSize" />
    @if (windowSize > 1000) {
      <app-social />
    }
  </nav>
  <main class="main">
    <router-outlet />
  </main>
  @if (windowSize <= 1000) {
    <app-header [windowSize]="windowSize" />
  }
</div>
